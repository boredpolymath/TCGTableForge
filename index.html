  function renderWorkspace(){const root=$('#workspace'),p=current();if(!p){root.innerHTML=`<div class="empty-state"><div class="empty-icon">＋</div><h2>Your design space is ready</h2><p>Start from an idea you already have, or explore a worked example to see how the cards fit together.</p><div class="empty-choices"><div class="empty-choice"><button class="button primary" id="emptyNew">Create your first project</button><p>Begin with a world idea or a gameplay hook.</p></div><div class="empty-choice"><button class="button" id="loadSampleProject">Load Sample Project</button><p>Explore a sample setting, themes, mechanics, and connections.</p></div></div></div><div class="footer-status" role="status" aria-live="polite" aria-atomic="true"></div><p class="footer-local-note">Projects are stored on this device and are not synchronized.</p>`;$('#emptyNew').onclick=()=>projectDialog();$('#loadSampleProject').onclick=loadSampleProject;renderStatus();return}

    <div class="toolbar"><label class="search-wrap"><span aria-hidden="true">⌕</span><input class="search" id="search" type="search" placeholder="Search cards and notes" value="${esc(query)}" aria-label="Search cards and notes"></label><select class="select" id="filter" aria-label="Filter cards by type"><option>All types</option>${TYPES.map(t=>`<option ${filter===t?'selected':''}>${t}</option>`).join('')}</select><select class="select" id="sort" aria-label="Sort cards"><option ${sort==='Recently modified'?'selected':''}>Recently modified</option><option ${sort==='Title'?'selected':''}>Title</option><option ${sort==='Type'?'selected':''}>Type</option></select><span class="result-count">${cards.length} of ${p.cards.length} cards</span></div>
    ${p.cards.length===0?`<div class="empty-state"><div class="empty-icon">＋</div><h2>Start with one useful idea</h2><p>${esc(starters[p.approach])}</p><button class="button primary" id="emptyAdd">Add your first card</button></div>`:cards.length===0?`<div class="empty-state"><div class="empty-icon">⌕</div><h2>No matching cards</h2><p>Try another search or clear the type filter to see more of this project.</p><button class="button" id="clearSearch">Clear search and filters</button></div>`:view==='board'?`<div class="section-head"><div class="section-copy"><h2>Your ideas</h2><span>Build connections as the idea takes shape</span></div><div class="section-tools">${mapActions}${viewSwitch}</div></div><div class="board" role="list" aria-label="Design ideas">${lanes}</div>`:`<div class="section-head"><div class="section-copy"><h2>Your ideas</h2><span>Browse every idea in a simple list</span></div><div class="section-tools">${mapActions}${viewSwitch}</div></div><div class="list-view">${cards.map(c=>`<div class="list-row" role="button" tabindex="0" data-card="${esc(c.cardId)}" aria-label="Edit ${esc(c.type)} card: ${esc(c.title)}"><span class="type-chip" style="--card-color:${COLORS[c.type]};color:${COLORS[c.type]}"><i class="type-symbol">${SYMBOLS[c.type]}</i>${esc(c.type)}</span><div class="list-copy"><strong>${esc(c.title)}</strong><p>${esc(c.notes||'No notes yet')}</p></div><time>${new Date(c.updatedAt).toLocaleDateString()}</time></div>`).join('')}</div>`}

  function cardHtml(c,p){let n=p.relationships.filter(r=>r.fromCardId===c.cardId||r.toCardId===c.cardId).length;return `<article class="card" role="listitem" aria-label="${esc(c.type)}: ${esc(c.title)}" style="--card-color:${COLORS[c.type]}"><div class="card-main" role="button" tabindex="0" data-card="${esc(c.cardId)}" aria-label="Edit ${esc(c.type)} card: ${esc(c.title)}"><h3>${esc(c.title)}</h3><p>${esc(c.notes||'Add notes to capture the idea behind this card.')}</p></div><div class="card-foot"><span>${new Date(c.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span class="card-type-indicator"><i>${SYMBOLS[c.type]}</i>${esc(c.type)}</span><button class="relation-mark" type="button" data-card-links="${esc(c.cardId)}" aria-label="View connections for ${esc(c.title)}">${n?`↗ ${n} ${n===1?'link':'links'}`:'＋ connect'}</button></div></article>`}
  function modal(title,sub,body,buttons){const returnFocus=document.activeElement,wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${title}</h2><p class="modal-sub">${sub}</p><div class="modal-body">${body}</div><div class="modal-actions">${buttons}</div></section>`;document.body.appendChild(wrap);const dialog=wrap.querySelector('.modal'),selector='button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])',focusable=()=>Array.from(dialog.querySelectorAll(selector)).filter(el=>el.getClientRects().length);dialog.tabIndex=-1;wrap.close=()=>{if(!wrap.isConnected)return;wrap.remove();if(returnFocus&&returnFocus!==document.body&&returnFocus.isConnected)returnFocus.focus({preventScroll:true})};wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.close()});wrap.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();wrap.close();return}if(e.key!=='Tab')return;const items=focusable();if(!items.length){e.preventDefault();dialog.focus();return}const first=items[0],last=items[items.length-1],active=document.activeElement;if(e.shiftKey&&(active===first||!dialog.contains(active))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(active===last||!dialog.contains(active))){e.preventDefault();first.focus()}});(focusable()[0]||dialog).focus();return wrap}
  function guide(){const content=`<div class="guide-lead"><p><strong>There’s no required order.</strong> Follow the ideas you already have, add a card when something feels worth keeping, and connect ideas when a relationship becomes clear.</p><div class="mini-flow" aria-label="World idea to player experience to theme to mechanic"><span>◈</span><i>→</i><span>◉</span><i>→</i><span>✳</span><i>→</i><span>⟳</span></div></div>
  <div class="guide-steps">
    <section class="guide-step"><div class="guide-step-head"><span class="step-number">1</span><h3>Pick a starting point</h3></div><div class="mini-projects"><span>World first</span><span>Mechanics first</span></div><p>Create a project and choose the direction that feels natural. Edit the starter prompt or clear it to skip. You can add a description and design goals now or later in <b>Settings</b>.</p></section>
    <section class="guide-step"><div class="guide-step-head"><span class="step-number">2</span><h3>Capture the idea</h3></div><div class="mini-cards"><div class="mini-card" style="--mini-color:#b16a3e"><b>◈</b><small>World</small></div><div class="mini-card" style="--mini-color:#78538d"><b>✳</b><small>Theme</small></div><div class="mini-card" style="--mini-color:#80ab00"><b>⟳</b><small>Mechanic</small></div></div><p>Use <b>Add card</b> for one specific thought. Choose its type, give it a short title, and add notes. Select a card later to edit it; deleting it also removes its links.</p></section>
    <section class="guide-step"><div class="guide-step-head"><span class="step-number">3</span><h3>Show how ideas connect</h3></div><div class="mini-link"><span>Knowledge has a cost</span><i>Expresses →</i><span>Memory as a resource</span></div><p>Choose <b>Connect cards</b>, pick two cards, and label the relationship: Supports, Expresses, Creates Tension With, or Depends On. Click a card’s link hint to view its connections or start a new one.</p></section>
    <section class="guide-step"><div class="guide-step-head"><span class="step-number">4</span><h3>Explore your map</h3></div><div class="mini-tools"><span>⌕ Search</span><span>Type filter</span><span>Sort</span><span>▦ / ☷</span></div><p>Use the toolbar to filter by type and search titles or notes. Sort by last modified time, title, or type, then switch between Board and List views.</p></section>
  </div>
  <details class="guide-reference"><summary>What are the five card types?</summary><div class="guide-reference-body"><ul><li><b>World</b> — a place, people, conflict, or striking detail.</li><li><b>Experience</b> — a feeling or choice you want players to have.</li><li><b>Theme</b> — an idea the game returns to, like discovery or sacrifice.</li><li><b>Mechanic</b> — a repeatable rule or action that could create that experience.</li><li><b>Question</b> — something to explore or learn through design.</li></ul></div></details>
  <details class="guide-reference"><summary>How do saving, offline work, and file transfer work?</summary><div class="guide-reference-body"><p>Changes are saved automatically in this browser on this device. Projects are not uploaded or synchronized.</p><ul><li><b>Export JSON</b> makes a backup you can import. Import validates the file and adds a separate copy.</li><li><b>Export Markdown</b> makes a readable snapshot for sharing or notes. It cannot be re-imported.</li><li>If save or export fails, retry, export a backup, or free browser storage. Clear browser site data may also remove projects.</li></ul><p>After the app loads once on localhost or HTTPS, its cached shell can open offline. If an update appears, save your edits before choosing Refresh.</p></div></details>
  <details class="guide-reference"><summary>Switch projects or delete data</summary><div class="guide-reference-body"><p>On mobile, use <b>Projects</b> to switch; on desktop, choose a project in the sidebar. Open <b>Settings</b> to edit project details or delete the current project. <b>Clear all data</b> removes every local project after confirmation. Deletion cannot be undone.</p></div></details>
  <div class="guide-tip"><span class="guide-tip-mark">✳</span><span><strong>Try a small loop:</strong> one world idea or hook → one player feeling → one theme → one possible mechanic. Add an open question anywhere you feel uncertain. These are possibilities, not commitments.</span></div>`;const m=modal('A quick visual guide','Follow the numbered cards to get started. Open the short reference panels when you need details.',content,'<button class="button" data-close-guide>Close guide</button><div class="modal-actions-right"><button class="button primary" data-start-project>＋ Start a project</button></div>');m.querySelector('.modal').classList.add('guide-modal');m.querySelector('[data-close-guide]').onclick=()=>m.close();m.querySelector('[data-start-project]').onclick=()=>{m.close();projectDialog()};m.querySelector('[data-close-guide]').focus();try{localStorage.setItem('world-mechanic-guide-seen','1')}catch(e){}return m}
  function fileActions(){const m=modal('Project files','Choose an action for the current project.',`<div class="file-action-list"><button class="file-action" data-file-action="json"><span class="file-action-icon">↓</span><strong>Export JSON backup</strong><small>Save a copy you can import into this app later.</small></button><button class="file-action" data-file-action="markdown"><span class="file-action-icon">≡</span><strong>Export Markdown</strong><small>Create a readable snapshot for sharing or notes.</small></button><button class="file-action" data-file-action="import"><span class="file-action-icon">↑</span><strong>Import JSON project</strong><small>Validate a file and add it as a separate project.</small></button></div>`,`<button class="button" data-cancel>Close</button>`);m.querySelector('.modal').classList.add('files-modal');m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('[data-file-action="json"]').onclick=()=>{m.close();jsonExport()};m.querySelector('[data-file-action="markdown"]').onclick=()=>{m.close();markdownExport()};m.querySelector('[data-file-action="import"]').onclick=()=>{m.close();$('#importFile').click()}}
  function projectSwitcher(){const content=projects.length?`<div class="project-switch-list">${projects.map(p=>`<button class="project-switch-option ${p.projectId===currentId?'current':''}" data-switch-project="${esc(p.projectId)}"><i></i><span>${esc(p.name)}</span>${p.projectId===currentId?'<small>Open</small>':''}</button>`).join('')}</div>`:`<div class="empty-projects"><p>No projects yet. Create one to start a design map.</p></div>`;const m=modal('Your projects','Choose a project to open, or start a new one.',content,'<button class="button" data-cancel>Close</button><div class="modal-actions-right"><button class="button primary" data-new-project>＋ New project</button></div>');m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('[data-new-project]').onclick=()=>{m.close();projectDialog()};m.querySelectorAll('[data-switch-project]').forEach(b=>b.onclick=()=>{currentId=b.dataset.switchProject;query='';filter='All types';render();m.close()})}
  function projectDialog(){let approach='world-first';const m=modal('Create a project','Choose where your first design question begins.',`<form id="projectForm"><div class="field"><label for="projectName">Project name</label><input id="projectName" required maxlength="100" placeholder="e.g. The Glass Frontier"></div><div class="field"><label>Starting approach</label><div class="approach-options"><button type="button" class="approach-option active" data-approach="world-first"><strong>World first</strong><span>Begin with a setting, premise, or atmosphere.</span></button><button type="button" class="approach-option" data-approach="mechanics-first"><strong>Mechanics first</strong><span>Begin with a gameplay hook or interaction.</span></button></div></div><div class="field"><label for="starterPrompt">Starting prompt <span style="font-weight:400;color:#999">(edit or clear to skip)</span></label><textarea id="starterPrompt" maxlength="500">${esc(starters[approach])}</textarea></div><div class="field"><label for="projectDesc">Short description <span style="font-weight:400;color:#999">(optional)</span></label><textarea id="projectDesc" maxlength="500" placeholder="What is this game about?"></textarea></div><div class="field"><label for="designGoals">Design goals <span style="font-weight:400;color:#999">(optional)</span></label><input id="designGoals" maxlength="300" placeholder="How should a match feel?"></div></form>`,`<button class="button" data-cancel>Cancel</button><div class="modal-actions-right"><button class="button primary" id="createProject">Create project</button></div>`);m.querySelectorAll('[data-approach]').forEach(b=>b.onclick=()=>{approach=b.dataset.approach;m.querySelectorAll('[data-approach]').forEach(x=>x.classList.toggle('active',x===b));if(!m.querySelector('#starterPrompt').dataset.edited)m.querySelector('#starterPrompt').value=starters[approach]});m.querySelector('#starterPrompt').oninput=e=>e.target.dataset.edited='yes';m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('#createProject').onclick=()=>{const name=m.querySelector('#projectName').value.trim();if(!name){m.querySelector('#projectName').focus();return}const p={projectId:id(),name,approach,starterPrompt:m.querySelector('#starterPrompt').value.trim(),description:m.querySelector('#projectDesc').value.trim(),designGoals:m.querySelector('#designGoals').value.trim(),createdAt:now(),updatedAt:now(),cards:[],relationships:[]};projects.unshift(p);currentId=p.projectId;save();render();m.close();toast('Project created. Add a card to start mapping the idea.');};m.querySelector('#projectName').focus()}
  function cardDialog(cardId){const p=current(),old=p.cards.find(c=>c.cardId===cardId),isEdit=!!old;const m=modal(isEdit?'Edit card':'Add a card',isEdit?'Refine the idea or update its notes.':'Capture one idea at a time. You can connect cards as the design develops.',`<form><div class="field"><label for="cardType">Card type</label><select id="cardType">${TYPES.map(t=>`<option ${old?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="cardTitle">Title</label><input id="cardTitle" required maxlength="120" value="${esc(old?.title||'')}" placeholder="A short, specific idea"></div><div class="field"><label for="cardNotes">Notes</label><textarea id="cardNotes" maxlength="3000" placeholder="What could this mean for the game?">${esc(old?.notes||'')}</textarea></div><div class="field"><span class="hint">Starting prompt: ${esc(starters[p.approach])}</span></div></form><div class="form-error" id="cardError"></div>`,`<div>${isEdit?'<button class="button danger" id="deleteCard">Delete card</button>':''}</div><div class="modal-actions-right"><button class="button" data-cancel>Cancel</button><button class="button primary" id="saveCard">${isEdit?'Save changes':'Add card'}</button></div>`);m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('#saveCard').onclick=()=>{const title=m.querySelector('#cardTitle').value.trim();if(!title){m.querySelector('#cardError').textContent='Add a title before saving.';m.querySelector('#cardError').style.display='block';return}const stamp=now();if(old){old.type=m.querySelector('#cardType').value;old.title=title;old.notes=m.querySelector('#cardNotes').value.trim();old.updatedAt=stamp}else p.cards.push({cardId:id(),projectId:p.projectId,type:m.querySelector('#cardType').value,title,notes:m.querySelector('#cardNotes').value.trim(),createdAt:stamp,updatedAt:stamp});p.updatedAt=stamp;save();render();m.close();toast(isEdit?'Card updated.':'Card added.')};m.querySelector('#deleteCard')?.addEventListener('click',()=>{if(!confirm(`Delete “${old.title}” and its connections?`))return;p.cards=p.cards.filter(c=>c.cardId!==old.cardId);p.relationships=p.relationships.filter(r=>r.fromCardId!==old.cardId&&r.toCardId!==old.cardId);p.updatedAt=now();save();render();m.close();toast('Card and its connections deleted.')});m.querySelector('#cardTitle').focus()}
  function connectionsDialog(cardId){const p=current(),card=p.cards.find(c=>c.cardId===cardId);if(!card)return;const links=p.relationships.filter(r=>r.fromCardId===cardId||r.toCardId===cardId);const canConnect=p.cards.length>=2;const body=links.length?`<div class="connection-modal-list">${links.map(r=>{const outgoing=r.fromCardId===cardId,other=p.cards.find(c=>c.cardId===(outgoing?r.toCardId:r.fromCardId));if(!other)return '';return `<div class="connection-modal-row"><span class="connection-modal-icon" style="--connection-color:${COLORS[other.type]}">${SYMBOLS[other.type]}</span><span class="connection-modal-copy"><b>${esc(other.title)}</b><small>${outgoing?`This card ${esc(r.label.toLowerCase())} ${esc(other.title)}`:`${esc(other.title)} ${esc(r.label.toLowerCase())} this card`}</small></span><span class="connection-modal-type">${esc(other.type)}</span></div>`}).join('')}</div>`:`<div class="connection-empty"><span aria-hidden="true">↗</span><h3>No connections yet</h3><p>${canConnect?'Connect this idea to another card to show how they relate.':'Add another card before connecting this idea.'}</p></div>`;const m=modal('Connections',card.title,body,`<button class="button" data-cancel>Close</button><div class="modal-actions-right"><button class="button primary" data-add-connection>${canConnect?(links.length?'＋ Add connection':'＋ Create first connection'):'＋ Add another card'}</button></div>`);m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('[data-add-connection]').onclick=()=>{m.close();if(canConnect)relationDialog(cardId);else cardDialog()}}
  function relationDialog(selectedCardId=null){const p=current();if(p.cards.length<2){toast('Add at least two cards before creating a connection.',true);return}const fromId=p.cards.some(c=>c.cardId===selectedCardId)?selectedCardId:p.cards[0].cardId;const toId=p.cards.find(c=>c.cardId!==fromId).cardId;const opts=(selectedId)=>p.cards.map(c=>`<option value="${esc(c.cardId)}" ${c.cardId===selectedId?'selected':''}>${esc(c.title)} · ${esc(c.type)}</option>`).join('');const m=modal('Connect two ideas','Name the relationship that makes the connection useful.',`<div class="field"><label for="fromCard">From</label><select id="fromCard">${opts(fromId)}</select></div><div class="field"><label for="relationshipLabel">Relationship</label><select id="relationshipLabel">${LABELS.map(l=>`<option>${l}</option>`).join('')}</select></div><div class="field"><label for="toCard">To</label><select id="toCard">${opts(toId)}</select></div><div class="form-error" id="relationError"></div>`,`<button class="button" data-cancel>Cancel</button><div class="modal-actions-right"><button class="button primary" id="saveRelation">Create connection</button></div>`);m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('#saveRelation').onclick=()=>{const from=m.querySelector('#fromCard').value,to=m.querySelector('#toCard').value;if(from===to){const e=m.querySelector('#relationError');e.textContent='Choose two different cards.';e.style.display='block';return}if(p.relationships.some(r=>r.fromCardId===from&&r.toCardId===to&&r.label===m.querySelector('#relationshipLabel').value)){toast('That connection already exists.',true);return}p.relationships.push({relationshipId:id(),projectId:p.projectId,fromCardId:from,toCardId:to,label:m.querySelector('#relationshipLabel').value,createdAt:now()});p.updatedAt=now();save();render();m.close();toast('Connection added.')}}
  function download(name,content,type){try{const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`${name} exported.`)}catch(e){toast('Export failed. Your saved project is unchanged; try again or copy your project data from settings.',true)}}
  function jsonExport(){const p=current();if(p)download(p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json',JSON.stringify({schemaVersion:1,project:p},null,2),'application/json')}
  function markdownExport(){const p=current();if(!p)return;let out=`# ${p.name}\n\n**Approach:** ${p.approach==='world-first'?'World first':'Mechanics first'}\n\n${p.description||''}\n\n${p.designGoals?`**Design goals:** ${p.designGoals}\n\n`:''}## Cards\n`;for(const t of TYPES){const cards=p.cards.filter(c=>c.type===t);if(cards.length){out+=`\n### ${t}\n`;cards.forEach(c=>out+=`\n#### ${c.title}\n\n${c.notes||'_No notes._'}\n`)}}out+='\n## Connections\n';p.relationships.forEach(r=>{let a=p.cards.find(c=>c.cardId===r.fromCardId),b=p.cards.find(c=>c.cardId===r.toCardId);if(a&&b)out+=`\n- **${a.title}** — ${r.label.toLowerCase()} → **${b.title}**`});download(p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.md',out,'text/markdown')}
  function validateImport(x){const p=x?.project||x;if(!p||typeof p!=='object')throw Error('The file does not contain a project object.');if(typeof p.name!=='string'||!p.name.trim())throw Error('A project name is required.');if(!['world-first','mechanics-first'].includes(p.approach))throw Error('The approach must be world-first or mechanics-first.');if(!Array.isArray(p.cards)||!Array.isArray(p.relationships))throw Error('Cards and relationships must be lists.');if(p.cards.length>5000||p.relationships.length>10000)throw Error('This project is larger than the supported import limit.');let ids=new Set();for(const c of p.cards){if(!c||typeof c.cardId!=='string'||!c.cardId||ids.has(c.cardId)||typeof c.title!=='string'||!c.title.trim()||!TYPES.includes(TYPE_ALIASES[c.type]||c.type)||typeof c.notes!=='string')throw Error('Each card needs a unique ID, supported type, title, and notes as text.');c.type=TYPE_ALIASES[c.type]||c.type;if(c.title.length>120||c.notes.length>3000)throw Error('A card title or notes field is too long.');ids.add(c.cardId)}for(const r of p.relationships){if(!r||!ids.has(r.fromCardId)||!ids.has(r.toCardId)||!LABELS.includes(r.label))throw Error('A connection refers to a missing card or unsupported relationship.')}return p}
  function importFile(file){if(!file)return;if(file.size>10*1024*1024){toast('Import rejected: project files must be 10 MB or smaller.',true);return}const reader=new FileReader();reader.onload=()=>{try{let src=JSON.parse(reader.result),p=validateImport(src);let copy=JSON.parse(JSON.stringify(p));copy.projectId=id();copy.name=copy.name+' (imported)';copy.createdAt=now();copy.updatedAt=now();let map=new Map();copy.cards=copy.cards.map(c=>{let old=c.cardId;c.cardId=id();map.set(old,c.cardId);c.projectId=copy.projectId;c.createdAt=now();c.updatedAt=now();return c});copy.relationships=copy.relationships.map(r=>({...r,relationshipId:id(),projectId:copy.projectId,fromCardId:map.get(r.fromCardId),toCardId:map.get(r.toCardId),createdAt:now()}));projects.unshift(copy);currentId=copy.projectId;save();render();toast('Project imported as a separate copy.')}catch(e){toast('Import rejected: '+(e instanceof SyntaxError?'the file is not valid JSON.':e.message),true)}};reader.onerror=()=>toast('Could not read that file. Your existing projects are unchanged.',true);reader.readAsText(file)}
  function deleteProject(){const p=current();if(!p)return;if(!confirm(`Delete “${p.name}” and all ${p.cards.length} cards and ${p.relationships.length} connections in it? This cannot be undone.`))return;projects=projects.filter(x=>x.projectId!==p.projectId);currentId=projects[0]?.projectId||null;save();render();toast('Project deleted.')}
  $('#newProject').onclick=()=>projectDialog();$('#mobileProjectSwitch').onclick=()=>projectSwitcher();$('#guideBtn').onclick=()=>guide();$('#filesBtn').onclick=()=>fileActions();$('#importFile').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};$('#settingsBtn').onclick=()=>{const project=current();const fields=project?`<div class="field"><label for="editProjectName">Project name</label><input id="editProjectName" maxlength="100" value="${esc(project.name)}"></div><div class="field"><label for="editProjectDesc">Description</label><textarea id="editProjectDesc" maxlength="500">${esc(project.description||'')}</textarea></div><div class="field"><label for="editProjectGoals">Design goals</label><textarea id="editProjectGoals" maxlength="300">${esc(project.designGoals||'')}</textarea></div><p class="hint">Projects are stored on this device. Clearing browser site data may also remove them.</p>`:`<p class="hint">No project is open. Choose or create a project to edit its details.</p>`;const dataAction=`<section class="local-data-setting" aria-label="Local project data"><div><b>Local project data</b><p>Clear every project and card stored in this browser. This cannot be undone.</p></div><button class="button danger" id="deleteAllBtn">Clear all data</button></section>`;const footer=`${project?'<button class="button danger" id="deleteProject">Delete project</button>':''}<div class="modal-actions-right"><button class="button" data-cancel>${project?'Cancel':'Close'}</button>${project?'<button class="button primary" id="saveSettings">Save details</button>':''}</div>`;const m=modal(project?'Project settings':'Settings',project?'Update the details that orient your design.':'Manage projects stored on this device.',`${fields}${dataAction}`,footer);m.querySelector('.modal').classList.add('settings-modal');m.querySelector('[data-cancel]').onclick=()=>m.close();m.querySelector('#saveSettings')?.addEventListener('click',()=>{const p=current();p.name=m.querySelector('#editProjectName').value.trim()||p.name;p.description=m.querySelector('#editProjectDesc').value.trim();p.designGoals=m.querySelector('#editProjectGoals').value.trim();p.updatedAt=now();save();render();m.close();toast('Project details updated.')});m.querySelector('#deleteProject')?.addEventListener('click',()=>{m.close();deleteProject()});m.querySelector('#deleteAllBtn').onclick=()=>{if(!projects.length){toast('There are no saved projects.');return}if(!confirm(`Delete all ${projects.length} locally stored projects and their cards and connections? This cannot be undone. Browser site-data clearing may also remove them.`))return;projects=[];currentId=null;save();render();m.close();toast('All local project data deleted.')}};
  addEventListener('online',renderStatus);addEventListener('offline',renderStatus);
  if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').then(reg=>{if(reg.waiting)$('#updateBanner').style.display='block';reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)$('#updateBanner').style.display='block'})})}).catch(()=>{});
  $('#refreshBtn').onclick=async()=>{if(!flushSave())return;const reg=await navigator.serviceWorker?.getRegistration();if(reg?.waiting){refreshing=true;reg.waiting.postMessage({type:'SKIP_WAITING'})}else location.reload()};navigator.serviceWorker?.addEventListener?.('controllerchange',()=>{if(refreshing)location.reload()});load();try{if(!localStorage.getItem('world-mechanic-guide-seen'))setTimeout(()=>guide(),350)}catch(e){}
})();
</script>
